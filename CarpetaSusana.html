<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tarea Susana Ceballos Gómez</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      .contenedor {
        text-align: center;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 24px;
        margin-bottom: 20px;
      }

      img {
        width: 100%;
        max-width: 600px;
        border-radius: 10px;
        display: block;
      }

      .fecha {
        font-size: 13px;
        color: #777;
        margin-top: 8px;
      }

      .boton {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 22px;
        background-color: #e31b23;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
      }

      .boton:hover {
        background-color: #bd151c;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <h1>Tarea Susana Ceballos Gómez</h1>

      <img src="robot.png" alt="Proyecto Robot" />

      <div class="fecha">Agosto 8</div>

      <a
        class="boton"
        href="https://www.tinkercad.com/things/0jjO0aWsimM/edit?returnTo=%2Fdashboard&sharecode=iItI-WZZj_pDkEpGL1g-3RpePOOmn6eMcKp_T0sdNeg"
        target="_blank"
      >
        Ir al proyecto
      </a>
    </div>
  </body>
</html>
